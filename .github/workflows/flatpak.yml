name: Flatpak build

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:gnome-50
      options: --privileged
    steps:
      - uses: actions/checkout@v4

      # src-stage is a gitignored build artifact, so CI regenerates it the
      # same way the local build script does. The app icon is committed at
      # packaging/flatpak/assets/audio-library.png (512x512, flatpak max).
      - name: Stage source tree
        run: |
          rm -rf packaging/flatpak/src-stage && mkdir -p packaging/flatpak/src-stage
          tar -C . --exclude=.git --exclude=target \
              --exclude=./packaging/flatpak/build \
              --exclude=./packaging/flatpak/src-stage \
              -cf - . | tar -C packaging/flatpak/src-stage -xf -

      - uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          bundle: org.example.AudioLibrary.flatpak
          manifest-path: packaging/flatpak/org.example.AudioLibrary.yaml
          cache-key: flatpak-builder-${{ github.ref }}

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: org.example.AudioLibrary.flatpak
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
